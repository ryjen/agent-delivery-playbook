[tasks.test]
description = "Run validator unit tests inside the flake-owned environment"
run = "nix develop --command python3 -m unittest discover -s tests -p 'test_*.py' -v"

[tasks.validate-standard]
description = "Run standards-based YAML and JSON Schema validation inside the flake-owned environment"
run = "nix develop --command python3 scripts/validate-task-envelopes-standard.py"

[tasks.validate-lightweight]
description = "Run dependency-free task-envelope validation inside the flake-owned environment"
run = "nix develop --command python3 scripts/validate-task-envelopes.py"

[tasks.validate-repository]
description = "Run repository-integrity validation inside the flake-owned environment"
run = "nix develop --command python3 scripts/validate-repository.py"

[tasks.validate-adversarial]
description = "Run adversarial bypass-resistance fixture validation"
run = "nix develop --command python3 scripts/validate-adversarial-fixtures.py"

[tasks.validate]
description = "Run all repository validation through the authoritative Nix flake"
run = "nix flake check --print-build-logs"
