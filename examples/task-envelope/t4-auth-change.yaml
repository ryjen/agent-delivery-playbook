task:
  id: T-0004
  title: Review access-control policy change
  objective: Change access-control behavior only after explicit approval and security review.
  owner: rj

classification:
  type: security
  risk_tier: T4

context:
  repositories:
    - example/service
  references:
    - "security-review: pending"

constraints:
  allowed:
    - inspect access-control code
    - propose implementation plan
    - add negative tests after approval
  prohibited:
    - reducing validation
    - reading secrets
    - changing CI permissions
    - merging without security review

execution:
  tools:
    - repo_read
    - approval_gate
    - shell_tests
    - github_pr
  actions:
    - inspect
    - request_approval
    - patch_after_approval
    - test
    - summarize

evidence:
  required_levels:
    - E2
    - E3
    - E4
  tests:
    - unit tests
    - negative access-control tests
    - smoke validation
  artifacts:
    - approval record
    - security review notes
    - rollback plan
    - PR diff

review:
  required: true
  approvers:
    - security_owner
    - code_owner
  notes: Security-sensitive work is blocked until explicit approval exists.

status: proposed
