task:
  id: T-0004
  title: Prepare access-control policy change for human-led execution
  objective: Inspect the requested access-control change, prepare a bounded plan and negative-test design, and leave privileged implementation to an authorized human.
  owner: security-owner

classification:
  type: security
  risk_tier: T4

context:
  repositories:
    - example/service
  references:
    - "security-review: required"

constraints:
  allowed:
    - inspect access-control code
    - document affected invariants
    - propose implementation steps
    - propose negative tests
    - prepare a review checklist
  prohibited:
    - modifying access-control implementation
    - exercising production or privileged credentials
    - reducing validation
    - reading secrets
    - changing CI permissions
    - merging or releasing the change

execution:
  tools:
    - repo_read
  actions:
    - inspect
    - plan
    - propose_tests
    - summarize

evidence:
  required_levels:
    - E2
    - E3
    - E4
  tests:
    - proposed unit and negative access-control tests
    - human-executed operational validation required before merge
  artifacts:
    - threat and invariant notes
    - human execution plan
    - proposed test matrix
    - rollback or recovery plan
    - independent review record

review:
  required: true
  approvers:
    - security_owner
    - code_owner
  notes: Restricted work remains human-led; this envelope authorizes analysis and preparation, not privileged implementation.

status: proposed
