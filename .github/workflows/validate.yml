name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate repository artifacts
        run: python3 scripts/validate-repository.py

  task-envelopes:
    name: Task envelopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned validation dependencies
        run: python3 -m pip install --requirement requirements-validation.txt

      - name: Test task-envelope validators
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate task envelopes
        run: |
          python3 scripts/validate-task-envelopes.py
          python3 scripts/validate-task-envelopes-standard.py
